name: Cult.fit Class Booker

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  book-class:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Or any recent Python 3 version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run booking script
        env:
          # These secrets are pulled from your repository's secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CULT_API_KEY: ${{ secrets.CULT_API_KEY }}
          CULT_ST_COOKIE: ${{ secrets.CULT_ST_COOKIE }}
          CULT_AT_COOKIE: ${{ secrets.CULT_AT_COOKIE }}
        run: python app.py